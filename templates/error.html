{{ define "title" }}{{ .Title }} — FastBite Delivery{{ end }}

{{ define "content" }}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-4">
            <div class="card-body">
                <i class="bi bi-shield-lock-fill text-danger display-1 mb-3"></i>
                <h2 class="fw-bold mb-2">{{ .Title }}</h2>
                <p class="text-muted lead mb-4">{{ .Message }}</p>
                <a href="/" class="btn btn-primary px-4 fw-bold">Return to Home</a>
            </div>
        </div>
    </div>
</div>
{{ end }}

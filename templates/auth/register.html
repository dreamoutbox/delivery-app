{{ define "title" }}Register — Delivery{{ end }}

{{ define "content" }}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-center mb-3"><i class="bi bi-person-plus-fill text-primary"></i> Create Account
                </h3>
                <p class="text-muted text-center small mb-4">Join Food Delivery</p>

                {{ if .Error }}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ .Error }}
                </div>
                {{ end }}

                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ .Name }}" required
                            placeholder="John Doe">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ .Email }}" required
                            placeholder="name@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required
                            placeholder="Minimum 6 characters">
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Register As</label>
                        <select class="form-select" id="role" name="role">
                            <option value="customer" selected>Customer (Order food)</option>
                            <option value="restaurant">Restaurant Owner (Sell food)</option>
                            <option value="rider">Rider (Deliver food)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">Create Account</button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="/login" class="small fw-bold text-decoration-none ms-1">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
